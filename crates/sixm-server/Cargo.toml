[package]
name = "sixm-server"
description = "SixM dedicated server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sixm-protocol.workspace = true
sixm-lua.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "io-std", "signal"] }
# HTTP/1 server that works without `Send` bounds; the WebSocket upgrade is done by hand on top of it.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Local wall-clock time for log lines (std only offers UTC).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
sixm-client = { path = "../sixm-client" }
