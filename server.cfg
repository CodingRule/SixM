# SixM server configuration. One command per line; # and // start a comment.

# Where the server listens. HTTP and the game connection share this one port.
endpoint_add_tcp "0.0.0.0:30120"

sv_hostname "My SixM Server"
sv_maxclients 32

# How many times per second player positions are sent out.
sv_tickrate 20

# Players further apart than this (in metres) are not sent to each other. 0 = no limit.
sv_streamdistance 500

# Shown in /info.json.
sets tags "default, sixm"
sets locale "en-US"

# Values your resources can read with GetConvar.
set welcome_message "Welcome to SixM!"
set chat_max_length 200

# Resources to start, in order.
ensure chat
ensure welcome
ensure hello
