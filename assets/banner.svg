    <rect x="360" y="212" width="96" height="6" rx="3" fill="url(#line)"/>
    <text x="358" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#d6cfe6">Lua-scripted multiplayer, built for the next generation.</text>
