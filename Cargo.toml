[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/CodingRule/SixM"
rust-version = "1.80"

[workspace.dependencies]
sixm-protocol = { path = "crates/sixm-protocol" }
sixm-lua = { path = "crates/sixm-lua" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwinding is kept on: the server contains a panicking handler instead of dying with it.
